# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv: ['.env']

tasks:
  dev:
    desc: "Run application in development mode"
    cmds:
      - task: migrate:up
      - go run ./cmd/api/main.go

  build:
    desc: "Build application binary"
    cmds:
      - go build -o bin/moodfly ./cmd/api/main.go

  run:
    desc: "Run built binary"
    cmds:
      - ./bin/moodfly

  docker:up:
    desc: "Start Docker containers"
    cmds:
      - docker compose up --wait --wait-timeout 10

  docker:down:
    desc: "Stop Docker containers"
    cmds:
      - docker-compose down

  docker:restart:
    desc: "Restart Docker containers"
    cmds:
      - task: docker:down
      - task: docker:up

  migrate:up:
    desc: "Run migrations"
    cmds:
      - migrate -path migrations -database "{{.POSTGRES_URL}}" up

  migrate:down:
    desc: "Cancel last migration"
    cmds:
      - migrate -path migrations -database "{{.POSTGRES_URL}}" down 1

  migrate:create:
    desc: "Create migration"
    cmds:
      - migrate create -ext sql -dir migrations -seq {{.CLI_ARGS}}
      